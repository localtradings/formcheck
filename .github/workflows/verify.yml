name: Verify FormCheck

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Android
            runner: ubuntu-24.04
            archive_key: linux
            sdk_arch: x64
          - platform: iOS
            runner: macos-26
            archive_key: macos
            sdk_arch: arm64
    steps:
      - uses: actions/checkout@v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5.0.0
        if: matrix.platform == 'Android'
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned Flutter SDK
        env:
          ARCHIVE_KEY: ${{ matrix.archive_key }}
          SDK_ARCH: ${{ matrix.sdk_arch }}
        run: |
          python3 - "$(cat .flutter-version)" "$ARCHIVE_KEY" "$SDK_ARCH" <<'PY'
          import hashlib, json, pathlib, sys, urllib.request
          version, platform, arch = sys.argv[1:]
          base = "https://storage.googleapis.com/flutter_infra_release/releases"
          with urllib.request.urlopen(f"{base}/releases_{platform}.json") as response:
              releases = json.load(response)["releases"]
          release = next(item for item in releases if item["version"] == version
                         and item["channel"] == "stable" and item["dart_sdk_arch"] == arch)
          archive = pathlib.Path("flutter.zip" if platform == "macos" else "flutter.tar.xz")
          urllib.request.urlretrieve(f'{base}/{release["archive"]}', archive)
          with archive.open("rb") as handle:
              assert hashlib.file_digest(handle, "sha256").hexdigest() == release["sha256"]
          PY
          if [ "$RUNNER_OS" = macOS ]; then
            unzip -q flutter.zip -d "$RUNNER_TEMP"
            rm flutter.zip
          else
            tar -xf flutter.tar.xz -C "$RUNNER_TEMP"
            rm flutter.tar.xz
          fi
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies and bundle the pose model
        run: |
          flutter pub get --enforce-lockfile
          dart run tool/prepare_pose_model.dart
      - name: Analyze and run automated tests
        if: matrix.platform == 'Android'
        run: |
          flutter analyze --no-pub
          flutter test --no-pub --reporter expanded
      - name: Compile Android debug APK without Firebase credentials
        if: matrix.platform == 'Android'
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          sdk_manager="$(find "$sdk_root/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$sdk_manager"
          "$sdk_manager" --sdk_root="$sdk_root" --install "platforms;android-36" "ndk;28.2.13676358"
          flutter build apk --debug --no-pub --target-platform android-arm64
      - name: Keep the Android verification APK
        uses: actions/upload-artifact@v4.6.2
        if: matrix.platform == 'Android'
        with:
          name: formcheck-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Compile iPhone simulator app without signing
        if: matrix.platform == 'iOS'
        run: flutter build ios --simulator --debug --no-codesign --no-pub
